# Mantiene despierto el proyecto gratuito de Supabase del juego.
# Los proyectos gratuitos se pausan tras 7 días sin actividad: esto hace una consulta
# pequeña (a la tabla «latido») dos veces por semana (lunes y jueves) para que no pase.
# La clave es la pública (anon), la misma que lleva la página de los móviles.
name: Despertar Supabase

on:
  schedule:
    - cron: "17 9 * * 1,4"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/despertar-supabase.yml"

jobs:
  despertar:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta a Supabase
        env:
          URL: https://gafwjvioemjobhfdrtht.supabase.co
          CLAVE: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdhZndqdmlvZW1qb2JoZmRydGh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ4OTA3NDMsImV4cCI6MjExMDQ2Njc0M30.nrD6N0sWZgaHsLUcMS4k5ZUiGODl4aCxgcdk8O0D1Ws
        run: |
          codigo=$(curl -s -o /dev/null -w '%{http_code}' "$URL/rest/v1/latido?select=id" -H "apikey: $CLAVE" -H "Authorization: Bearer $CLAVE")
          echo "Respuesta de Supabase: $codigo"
          if [ "$codigo" != "200" ]; then
            echo "Supabase no contesta bien: puede que el proyecto esté pausado (entra en supabase.com y pulsa Restore) o que falte la tabla «latido»."
            exit 1
          fi
